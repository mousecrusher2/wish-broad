name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache TypeScript and Vite build metadata
        uses: actions/cache@v6
        with:
          path: |
            tsconfig.app.tsbuildinfo
            tsconfig.node.tsbuildinfo
            node_modules/.tmp/tsconfig.worker.tsbuildinfo
            node_modules/.vite
          key: ${{ runner.os }}-build-metadata-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-build-metadata-

      - name: Enable Corepack
        run: corepack enable

      - name: Ensure sqlite3 is available
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types, lint, and unused exports
        run: pnpm check

      - name: Check React
        run: pnpm check:react

      - name: Check D1 schema drift
        run: pnpm schema:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
