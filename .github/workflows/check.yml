name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types, lint, and unused exports
        run: pnpm check

      - name: Check D1 schema drift
        run: pnpm schema:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
